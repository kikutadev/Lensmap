<!doctype html>
<html lang="en" data-i18n-document-title="capture.pageTitle">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lensmap · Select a region</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app" class="capture-app">
    <header class="capture-toolbar">
      <div>
        <strong data-i18n="capture.heading">Select a region</strong>
        <span data-i18n="capture.description">Drag over the figure, table, equation, or other area you want to keep as evidence.</span>
      </div>
      <div class="capture-actions">
        <button id="cancel" type="button" class="secondary" data-i18n="common.cancel">Cancel</button>
        <button id="save" type="button" disabled data-i18n="capture.addReference">Add reference</button>
      </div>
    </header>
    <section id="surface" class="capture-surface" aria-label="Visual Source capture surface" data-i18n-aria-label="capture.surfaceAria">
      <div id="loading" class="capture-message" data-i18n="capture.preparing">Preparing the screen…</div>
      <img id="capture-image" alt="Captured PDF viewport" data-i18n-alt="capture.imageAlt" draggable="false" hidden />
      <div id="selection" class="selection-rect" hidden></div>
    </section>
    <div id="status" class="capture-status" role="status"></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
